[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Call Me Maybe LLM Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.22.0",
    "pydantic>=2.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "llm-sdk",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
mypy_path = "llm_sdk"
exclude = [
    "^llm_sdk/",
    "^\\.venv/",
    "^Call-me-maybe/",
    "^moulinette/",
    "^present-me-maybe/"
]

# The llm_sdk is provided third-party code; don't type-check it when imported.
[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
