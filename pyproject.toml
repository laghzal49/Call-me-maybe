[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Call Me Maybe LLM Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pydantic>=2.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "llm-sdk>=1.0.1",
]


[tool.mypy]
mypy_path = "llm_sdk"
exclude = [
    "^intra-",
    "^llm_sdk/",
    "^\\.venv/",
    "^Call-me-maybe/",
    "^moulinette/",
    "^present-me-maybe/"
]

[tool.uv.sources]
llm_sdk = { path = "./llm_sdk" }

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
