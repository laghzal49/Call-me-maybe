[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Call Me Maybe LLM Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pydantic>=2.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[tool.uv.sources]
# CPU-only wheel: this machine has no NVIDIA GPU/driver, and the default
# PyPI torch wheel bundles CUDA runtime libs that it preloads at import
# time (ctypes.CDLL on multi-hundred-MB .so files), which can take tens of
# seconds on a cold disk cache and looks like a hang. The CPU wheel skips
# that entirely.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
mypy_path = "llm_sdk"
exclude = [
    "^llm_sdk/",
    "^\\.venv/",
    "^Call-me-maybe/",
    "^moulinette/",
    "^present-me-maybe/"
]

# The llm_sdk is provided third-party code; don't type-check it when imported.
[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
